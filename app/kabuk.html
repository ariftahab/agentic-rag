<!-- Ortak kabuk: kenar çubuğu + ana alanın üst çubuğu. Sayfa dosyaları (index.html, admin.html) KABUK işaret çiftinin
     arasına yalnız kendi içeriklerini yazar; app/main.py bu dosyayı ICERIK işaretinden iki parçaya bölüp sayfanın
     başına ve sonuna yerleştirir, etkin gezinme bağlantısını işaretler. Ana alan (main) sayfanın içeriğiyle sürer. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4Z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-build" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-up2" viewBox="0 0 24 24"><path d="M7 10v11H3V10Zm0 0 4-7a2 2 0 0 1 3 2l-1 4h6a2 2 0 0 1 2 2l-1.5 7a2 2 0 0 1-2 1.5H7"/></symbol>
    <symbol id="i-down2" viewBox="0 0 24 24"><path d="M7 14V3H3v11Zm0 0 4 7a2 2 0 0 0 3-2l-1-4h6a2 2 0 0 0 2-2l-1.5-7A2 2 0 0 0 17.5 4H7"/></symbol>
  </defs>
</svg>

<div class="app" id="app" data-view="{{GORUNUM}}">
  <aside class="side" id="side">
    <div class="brand">
      <img src="/static/logo-baibu.png" alt="BAİBÜ logosu">
      <div><b>Danışman Asistanı</b><small>Bolu Abant İzzet Baysal Üniversitesi</small></div>
      <button class="icon-btn" id="close-side" type="button" title="Kenar çubuğunu gizle" aria-label="Kenar çubuğunu gizle"><svg class="ico"><use href="#i-panel"/></svg></button>
    </div>

    <button class="new-chat" id="new-chat" type="button"><span class="plus"><svg class="ico"><use href="#i-plus"/></svg></span>Yeni sohbet</button>
    <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="side-search" placeholder="Sohbetlerde ara" aria-label="Sohbetlerde ara" autocomplete="off"></label>

    <nav class="nav" aria-label="Sayfalar">
      <a href="/" data-nav="sohbet"><svg class="ico"><use href="#i-chat"/></svg>Sohbet</a>
      <a href="/belgeler" data-nav="belgeler"><svg class="ico"><use href="#i-doc"/></svg>Belgeler<span class="count" id="doc-count"></span></a>
      <a href="/araclar" data-nav="araclar"><svg class="ico"><use href="#i-wrench"/></svg>Araçlar<span class="count" id="tool-count"></span></a>
      <!-- Yeni sekmede açılır: sohbet sekmesindeki transkript yalnız bellekte durur, bu sekme kapanmasın/yenilenmesin. -->
      <a href="/admin" data-nav="admin" target="_blank" rel="noopener" aria-label="Değerlendirme (yeni sekmede açılır)"><svg class="ico"><use href="#i-chart"/></svg>Değerlendirme<span class="count" title="Yeni sekmede açılır" aria-hidden="true">↗</span></a>
    </nav>

    <h6>Son sohbetler</h6>
    <div class="recents" id="recents"></div>
    <div class="privacy"><span>Sohbetler yalnız bu tarayıcıda saklanır.</span><button id="clear-all" type="button">Tümünü sil</button></div>

    <div class="side-foot">
      <!-- Bölüm / fakülte modülü: şimdilik yalnız gösterim, tıklanınca bir şey yapmaz (modül seçimi henüz yok). -->
      <div class="module">
        <svg class="ico"><use href="#i-build"/></svg>
        <span>Bilgisayar Mühendisliği<small>Mühendislik Fakültesi</small></span>
      </div>
      <div class="foot-row">
        <span class="status" id="status"></span>
        <button class="icon-btn" id="theme" type="button" title="Koyu / açık tema" aria-label="Koyu / açık tema"><svg class="ico"><use href="#i-sun"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn open-side" id="open-side" type="button" title="Kenar çubuğunu aç" aria-label="Kenar çubuğunu aç"><svg class="ico"><use href="#i-panel"/></svg></button>
      <div class="title" id="page-title">{{BASLIK}}</div>
      <div class="spacer"></div>
      <!-- Yalnız sohbet sayfasında görünür (chat.js doldurur): bu sohbetteki LLM token maliyeti. -->
      <span class="pill" id="cost" hidden aria-live="polite"></span>
    </div>
<!--ICERIK-->
  </main>
</div>
