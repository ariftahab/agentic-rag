<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Değerlendirme · Danışman Asistanı</title>
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/sayfalar.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="/static/shell.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/arac_bilgisi.js" defer></script>
  <script src="/static/admin.js" defer></script>
</head>
<body>
<!--KABUK-->
    <div class="page"><div class="page-in">
      <h1>Değerlendirme</h1>
      <p class="lead">Sistemin ne kadar doğru ve ne kadar hızlı çalıştığı, ayrıca kullanıcı cevaplarının elle incelenmesi.</p>
      <div class="tabs" id="eval-tabs" role="tablist">
        <button type="button" role="tab" data-t="runs" class="on" aria-selected="true">Deneyler</button>
        <button type="button" role="tab" data-t="answers" aria-selected="false">Kullanıcı cevapları</button>
      </div>

      <section id="tab-runs" role="tabpanel">
        <div class="stats" id="run-stats"></div>
        <div id="runs"></div>
      </section>

      <section id="tab-answers" role="tabpanel" hidden>
        <p class="lead">Kayıtlı soru-cevapları elle etiketle. Aynı cevabı tekrar kaydedersen en sonuncusu geçerli olur.</p>
        <div class="stats" id="stats"></div>
        <p class="stages" id="stages"></p>
        <div class="toolbar">
          <label class="check"><input type="checkbox" id="only-pending" checked> Yalnız değerlendirilmemişler</label>
          <span id="shown" class="shown"></span>
        </div>
        <div id="records"></div>
      </section>
    </div></div>
<!--/KABUK-->
</body>
</html>
